name: Build Mobile Apps (APK & iOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets & Sync Capacitor
        run: |
          node build.js
          chmod +x android/gradlew
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare Android APK Output
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/Mahjong-v2.5.1.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mahjong-Android-APK
          path: build-artifacts/Mahjong-v2.5.1.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS App Workspace & IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets & Sync Capacitor
        run: |
          node build.js
          npx cap sync ios

      - name: Build iOS Xcode App
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build

      - name: Package iOS IPA & App Zip
        run: |
          mkdir -p build-artifacts
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Found compiled iOS app at: $APP_PATH"
            APP_DIR=$(dirname "$APP_PATH")
            cd "$APP_DIR"
            mkdir -p Payload
            cp -r App.app Payload/
            zip -qr Mahjong-iOS-v2.5.1.ipa Payload
            zip -qr Mahjong-iOS-App.zip App.app
            cd -
            cp "$APP_DIR/Mahjong-iOS-v2.5.1.ipa" build-artifacts/
            cp "$APP_DIR/Mahjong-iOS-App.zip" build-artifacts/
            ls -lh build-artifacts/
          else
            echo "::error::App.app not found in build directory!"
            exit 1
          fi

      - name: Upload iOS App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mahjong-iOS-IPA
          path: |
            build-artifacts/Mahjong-iOS-v2.5.1.ipa
            build-artifacts/Mahjong-iOS-App.zip
          if-no-files-found: error

  publish-release:
    name: Publish Mobile Release (APK & IPA)
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: Mahjong-Android-APK
          path: dist

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Mahjong-iOS-IPA
          path: dist

      - name: List Release Files
        run: ls -la dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.1
          name: "打麻将 Mahjong v2.5.1 (iOS & Android & Web)"
          body: |
            ### 🀄 打麻将 (Mahjong Master) 全平台最新官方版本 v2.5.1
            
            云端 GitHub Actions 全自动多平台编译产物 (macOS-14 Apple Silicon Xcode + Ubuntu Android SDK)：

            #### 📦 下载文件 (Direct Downloads):
            - **Android 安装包**: [`Mahjong-v2.5.1.apk`](https://github.com/qingtian6325-lang/mahjong/releases/download/v2.5.1/Mahjong-v2.5.1.apk) (支持 Android 8.0 ~ Android 15，极速下载直接安装)
            - **iOS 安装包 (IPA)**: [`Mahjong-iOS-v2.5.1.ipa`](https://github.com/qingtian6325-lang/mahjong/releases/download/v2.5.1/Mahjong-iOS-v2.5.1.ipa) (支持 TrollStore / AltStore / Sideloadly / 巨魔 / 证书自签名安装)
            - **iOS 开发者免签包**: [`Mahjong-iOS-App.zip`](https://github.com/qingtian6325-lang/mahjong/releases/download/v2.5.1/Mahjong-iOS-App.zip)
            - **Web 在线畅玩**: [https://qingtian6325-lang.github.io/mahjong/](https://qingtian6325-lang.github.io/mahjong/) (支持 Safari / Chrome 一键【添加到主屏幕】作为原生 PWA 使用)

            #### ✨ v2.5.1 核心重大升级:
            1. **🗣️ 全真普通话语音报牌与音效**:
               - 出牌报牌：打出任何牌自动真人语音报出牌名（如「二条」、「五万」、「红中」），四位玩家各分配独立角色音色与音调。
               - 动作呐喊：吃、碰、杠、胡、自摸、花杠即刻激情发声！
               - 快捷短句：局内预设常用短句（「快点出牌啊，花儿都谢了！」「这把我要自摸，通通给钱～」等）全部支持真人语音朗读！
            2. **🀄 规则裁决与防丢胡保障**:
               - 胡牌最大：胡 ＞ 杠 ＞ 碰 ＞ 吃 严格仲裁。
               - 胡牌/碰牌选择弹窗：能胡牌时点击碰牌会弹出确认提示，防止误碰丢失胡牌。
               - 吃碰必须打牌与吃牌禁打同张规则：吃牌后本轮不可立即打出同面牌（标记「🚫禁打」并暗化拦截）。
            3. **🎯 牌桌视觉与记牌辅助**:
               - 弃牌池中被碰/吃/杠走的牌自动变暗并打上角标，直观辨识剩余张数。
               - 吃碰副露区显示张数统计胶囊（如「碰×1 吃×1 · 共6张」）。
            4. **🔄 Web & PWA 强力更新机制**:
               - 设置面板新增【🔄 强制刷新最新版】按钮，一键清空旧版 Service Worker 与缓存并重新载入最新版本。
            5. **🎨 正宗经典国风骨瓷麻将牌面 & 60秒思考倒计时 & 断线重连恢复**。
          files: |
            dist/*
        continue-on-error: true
