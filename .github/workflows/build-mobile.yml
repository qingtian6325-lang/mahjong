name: Build Mobile Apps (APK & iOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets & Sync Capacitor
        run: |
          node build.js
          chmod +x android/gradlew
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare Android APK Output
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/Mahjong-v2.5.2.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mahjong-Android-APK
          path: build-artifacts/Mahjong-v2.5.2.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS App Workspace & IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets & Sync Capacitor
        run: |
          node build.js
          npx cap sync ios

      - name: Build iOS Xcode App
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build

      - name: Package iOS IPA & App Zip
        run: |
          mkdir -p build-artifacts
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Found compiled iOS app at: $APP_PATH"
            APP_DIR=$(dirname "$APP_PATH")
            cd "$APP_DIR"
            mkdir -p Payload
            cp -r App.app Payload/
            zip -qr Mahjong-iOS-v2.5.2.ipa Payload
            zip -qr Mahjong-iOS-App.zip App.app
            cd -
            cp "$APP_DIR/Mahjong-iOS-v2.5.2.ipa" build-artifacts/
            cp "$APP_DIR/Mahjong-iOS-App.zip" build-artifacts/
            ls -lh build-artifacts/
          else
            echo "::error::App.app not found in build directory!"
            exit 1
          fi

      - name: Upload iOS App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mahjong-iOS-IPA
          path: |
            build-artifacts/Mahjong-iOS-v2.5.2.ipa
            build-artifacts/Mahjong-iOS-App.zip
          if-no-files-found: error

  publish-release:
    name: Publish Mobile Release (APK & IPA)
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: Mahjong-Android-APK
          path: dist

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Mahjong-iOS-IPA
          path: dist

      - name: List Release Files
        run: ls -la dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.2
          name: "打麻将 Mahjong v2.5.2 (iOS & Android & Web)"
          body: |
            ### 🀄 打麻将 (Mahjong Master) 全平台最新官方版本 v2.5.2
            
            云端 GitHub Actions 全自动多平台编译产物 (macOS-14 Apple Silicon Xcode + Ubuntu Android SDK)：

            #### 📦 下载文件 (Direct Downloads):
            - **Android 安装包**: [`Mahjong-v2.5.2.apk`](https://github.com/qingtian6325-lang/mahjong/releases/download/v2.5.2/Mahjong-v2.5.2.apk) (支持 Android 8.0 ~ Android 15，极速下载直接安装)
            - **iOS 安装包 (IPA)**: [`Mahjong-iOS-v2.5.2.ipa`](https://github.com/qingtian6325-lang/mahjong/releases/download/v2.5.2/Mahjong-iOS-v2.5.2.ipa) (支持 TrollStore / AltStore / Sideloadly / 巨魔 / 证书自签名安装)
            - **iOS 开发者免签包**: [`Mahjong-iOS-App.zip`](https://github.com/qingtian6325-lang/mahjong/releases/download/v2.5.2/Mahjong-iOS-App.zip)
            - **Web 在线畅玩**: [https://qingtian6325-lang.github.io/mahjong/](https://qingtian6325-lang.github.io/mahjong/) (支持 Safari / Chrome 一键【添加到主屏幕】作为原生 PWA 使用)

            #### ✨ v2.5.2 核心升级:
            1. **👤 玩家自定义雀神大名 & 留空系统自动分配**:
               - 玩家可随时自由自定义大名（模式选择、联机大厅、设置面板均可直接输入）。
               - 遵从「若未设置才自动分配」原则：输入框默认洁净留空，仅在玩家未输入时才自动抽取好运麻将封号（如「雀仙发哥」「十三幺」「逢赌必赢」等）。
               - 局内支持直接点击底部自己头像/名字呼出修改弹窗，牌桌头像首字与昵称实时同步！
            2. **🗣️ 全真普通话语音报牌与动作音效**：打出任何手牌报牌名，吃碰杠胡自摸语音呐喊，局内短句真人朗读。
            3. **🀄 规则裁决优先级与防丢胡保障**：胡牌最大、胡/碰选择弹窗、吃碰必须打牌与吃牌禁打同面牌规则。
            4. **🔄 Web & PWA 强力更新机制**：设置面板一键清空旧版缓存强制刷新。
          files: |
            dist/*
        continue-on-error: true
