name: Build Mobile Apps (APK & iOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets & Sync Capacitor
        run: |
          node build.js
          chmod +x android/gradlew
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare Android APK Output
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/Mahjong-v2.5.3.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mahjong-Android-APK
          path: build-artifacts/Mahjong-v2.5.3.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS App Workspace & IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets & Sync Capacitor
        run: |
          node build.js
          npx cap sync ios

      - name: Build iOS Xcode App
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build

      - name: Package iOS IPA & App Zip
        run: |
          mkdir -p build-artifacts
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Found compiled iOS app at: $APP_PATH"
            APP_DIR=$(dirname "$APP_PATH")
            cd "$APP_DIR"
            mkdir -p Payload
            cp -r App.app Payload/
            zip -qr Mahjong-iOS-v2.5.3.ipa Payload
            zip -qr Mahjong-iOS-App.zip App.app
            cd -
            cp "$APP_DIR/Mahjong-iOS-v2.5.3.ipa" build-artifacts/
            cp "$APP_DIR/Mahjong-iOS-App.zip" build-artifacts/
            ls -lh build-artifacts/
          else
            echo "::error::App.app not found in build directory!"
            exit 1
          fi

      - name: Upload iOS App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mahjong-iOS-IPA
          path: |
            build-artifacts/Mahjong-iOS-v2.5.3.ipa
            build-artifacts/Mahjong-iOS-App.zip
          if-no-files-found: error

  publish-release:
    name: Publish Mobile Release (APK & IPA)
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: Mahjong-Android-APK
          path: dist

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Mahjong-iOS-IPA
          path: dist

      - name: List Release Files
        run: ls -la dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.3
          name: "打麻将 Mahjong v2.5.3 (iOS & Android & Web)"
          body: |
            ### 🀄 打麻将 (Mahjong Master) 全平台最新官方版本 v2.5.3
            
            云端 GitHub Actions 全自动多平台编译产物 (macOS-14 Apple Silicon Xcode + Ubuntu Android SDK)：

            #### 📦 下载文件 (Direct Downloads):
            - **Android 安装包**: [`Mahjong-v2.5.3.apk`](https://github.com/qingtian6325-lang/mahjong/releases/download/v2.5.3/Mahjong-v2.5.3.apk) (支持 Android 8.0 ~ Android 15，极速下载直接安装)
            - **iOS 安装包 (IPA)**: [`Mahjong-iOS-v2.5.3.ipa`](https://github.com/qingtian6325-lang/mahjong/releases/download/v2.5.3/Mahjong-iOS-v2.5.3.ipa) (支持 SideStore / TrollStore / AltStore / Sideloadly / 巨魔 / 证书自签名安装)
            - **iOS 开发者免签包**: [`Mahjong-iOS-App.zip`](https://github.com/qingtian6325-lang/mahjong/releases/download/v2.5.3/Mahjong-iOS-App.zip)
            - **Web 在线畅玩**: [https://qingtian6325-lang.github.io/mahjong/](https://qingtian6325-lang.github.io/mahjong/) (支持 Safari / Chrome 一键【添加到主屏幕】作为原生 PWA 使用)

            #### ✨ v2.5.3 核心升级 (重大更新):
            1. **🀄 谁胡谁当庄家 (Winner Becomes Dealer)**:
               - 每局胜利者自动成为下一局庄家，庄家标志【庄】同步转移到胡牌玩家头像上！
               - 新一局庄家首先摸牌并由庄家打出第一张牌。
               - 若牌墙摸完产生流局，则庄家连庄（庄家不变），严格符合正统麻将规则。
            2. **📱 直屏自动全屏横向显示 & 手牌完全可见无遮挡**:
               - 废除原强制阻断全屏提示「请横屏放置手机」，竖屏握持手机时自动90度全屏旋转为横向牌桌视野，单手/双手竖握手机直接享受大屏畅爽牌局！
               - 顶部工具栏新增【🔄 旋转】快捷按钮，可随时切换「自适应横屏 / 强制横屏 / 保持竖屏」。
               - 深度优化横屏手牌底部安全区布局（Safe Area Inset），彻底解决底部手牌被系统手势条或浏览器地址栏遮挡的问题，14张手牌100%全显且极易轻触出牌！
            3. **🎉 其他玩家与联机自摸完美支持**:
               - 彻底修复联机对战中其他玩家与客端点击自摸被房主误拒绝的严重协议Bug！
               - 任何人摸牌自摸时，全网客户端实时同步播放自摸特效、大金鼓庆典音效与语音喊话，结算面板清晰标明「自摸胡 · 三家各付4分」。
            4. **🎵 声音起伏有调、感情生动鲜活**:
               - 彻底革新死板机械语音：根据牌桌不同角色注入独立生动语调与高低音（自己清脆元气、阿强豪爽大叔、小美甜美娇俏、老王老道沉稳）。
               - 升级骨瓷麻将扣桌啪音（高频清脆碰击+台呢沉厚共鸣）、进阶碰/杠铜钟共振以及大满贯自摸庆典音效！
          files: |
            dist/*
        continue-on-error: true
